<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens e Favicon</title>
</head>
<body>
    <h1>Testando carga de Imagens</h1>
    <p>Voce vai ver uma imagem que esta na mesma pasta.</p>
    <img src="logo-html.png" alt="Logo do HTML5"> <!-- imagem local/ da pasta -->
    <p>Podemos também carregar as imagens que estão em outras pastas, contato que ela esteja dentro da pasta atual.</p>
    <img src="fotos\logo-css.png" alt="Logo das CSS3"> <!-- imagem de um diretório -->
    <p>Também podemos carregar imagens externas, e para isso devemos ter a sua URL completa.</p>
    <img src="https://miro.medium.com/v2/resize:fit:640/format:webp/0*qDeatFw_hpTWpfpZ.gif" alt="Logo de JavaScript"> <!-- URL, imagem direto da web via link-->
</body>
</html>
