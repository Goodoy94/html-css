<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: rgb(169, 247, 52);
        } 
        p, address, h1 {
            text-align: center;
        }
    </style>
    <!-- Style é a maneira mais semântica de definir uma cor, posição e tamanho não só de textos, mas de todos os elementos existentes dentro do HTML. -->
    <title>Exemplo de Semântica</title>
</head>
<body>

    <h1>   
        Endereço
    </h1> <!-- Maior hierarquia de titulos. -->
    
    <p>
        Eu moro na,
    </p> <!-- Aqui apenas a parte escrita .-->
    
    <address>
        Rua do sobe e desce, 149 - SP 
    </address> <!-- Endereço descrito de maneira semântica -->
</body>
</html>
